name: Update AdGuard List

on:
  schedule:
    - cron: '0 4 * * *' # Tous les jours à 4h du matin UTC
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write
  pages: write       # déploiement de l'index de provenance sur GitHub Pages
  id-token: write    # requis par actions/deploy-pages

jobs:
  update-list:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run update script
      run: python update_list.py

    - name: Run provenance tests
      run: python -m unittest discover -s tests

    - name: Generate provenance shards
      run: python make_shards.py   # provenance.db -> pages/ (index.json + shards/)

    - name: Delete previous release
      run: |
        gh release delete latest-blocklist --yes || true
        git push --delete origin latest-blocklist || true
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create new release and upload blocklist
      run: |
        RULE_COUNT=$(grep -c "^[^!#]" blocklist.txt || true)
        DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
        NOTES=$(printf "**Règles actives :** %s\nGénérée automatiquement le %s." "$RULE_COUNT" "$DATE")
        gh release create latest-blocklist blocklist.txt \
          --title "Blocklist — $DATE" \
          --notes "$NOTES" \
          --latest \
          --target main
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Update stats file and commit
      run: |
        RULE_COUNT=$(grep -c "^[^!#]" blocklist.txt || true)
        DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
        echo "Dernière mise à jour : $DATE" > stats.txt
        echo "Nombre de règles : $RULE_COUNT" >> stats.txt
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add stats.txt
        git diff --cached --quiet || git commit -m "Mise à jour automatique des stats ($RULE_COUNT règles)"
        git push

    # --- Publication de l'index de provenance sur GitHub Pages ---
    # Prérequis (une seule fois) : Settings > Pages > Source = "GitHub Actions".
    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
